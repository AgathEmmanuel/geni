apiVersion: geni.io/v1alpha1
kind: Target
metadata:
  name: prod
  labels:
    environment: prod
    team: platform
spec:
  data:
    project: my-gcp-project
    region: us-central1
    zone: us-central1-c
    environment: prod
    network_name: prod-network
    cluster_name: prod-cluster
    db_instance_name: prod-db
    db_name: appdb
    db_user: appuser
    machine_type: e2-standard-4
    app_name: sample-app
    app_namespace: sample-app
    app_image: nginx:1.25-alpine
    app_port: 80

  output: generated/prod

  resources:
    # --- Terraform backend (GCS for state) ---
    backend:
      template: terraform/backend.tf
      params:
        bucket_name: ${{ data.project }}-tfstate
        tfstate_prefix: prod

    # --- Google Cloud provider ---
    provider:
      template: terraform/provider.tf
      params:
        project: ${{ data.project }}
        region: ${{ data.region }}

    # --- VPC, subnets, firewall, NAT ---
    networking:
      template: terraform/networking.py
      params:
        project: ${{ data.project }}
        region: ${{ data.region }}
        environment: ${{ data.environment }}
        network_name: ${{ data.network_name }}
        subnet_cidr: "10.32.0.0/20"
        pods_cidr: "10.36.0.0/14"
        services_cidr: "10.40.0.0/20"

    # --- Service accounts and IAM ---
    iam:
      template: terraform/iam.py
      params:
        project: ${{ data.project }}
        environment: ${{ data.environment }}
        app_name: ${{ data.app_name }}
        app_namespace: ${{ data.app_namespace }}
        cluster_name: ${{ data.cluster_name }}

    # --- GCS buckets ---
    storage:
      template: terraform/storage.py
      params:
        project: ${{ data.project }}
        region: ${{ data.region }}
        environment: ${{ data.environment }}
        app_name: ${{ data.app_name }}
        buckets:
          - name: app-assets
            versioning: true
          - name: app-uploads
            versioning: true
          - name: app-backups
            versioning: true
            lifecycle_age: 365

    # --- GCE bastion instance ---
    compute:
      template: terraform/compute.py
      params:
        project: ${{ data.project }}
        zone: ${{ data.zone }}
        environment: ${{ data.environment }}
        machine_type: ${{ data.machine_type }}
        network_name: ${{ data.network_name }}

    # --- GKE Autopilot cluster ---
    kubernetes:
      template: terraform/kubernetes.py
      params:
        project: ${{ data.project }}
        region: ${{ data.region }}
        environment: ${{ data.environment }}
        cluster_name: ${{ data.cluster_name }}
        network_name: ${{ data.network_name }}

    # --- Memorystore Redis (uses render_static) ---
    redis:
      template: terraform/redis.py
      params:
        project: ${{ data.project }}
        region: ${{ data.region }}
        environment: ${{ data.environment }}
        network_name: ${{ data.network_name }}
        default_tier: STANDARD_HA
        instances:
          - name: cache
            memory_size_gb: 5
            tier: STANDARD_HA
          - name: sessions
            memory_size_gb: 2
            tier: STANDARD_HA
            maxmemory_policy: volatile-lru

    # --- Nginx ingress (direct Helm chart) ---
    ingress:
      chart:
        path: charts/nginx-ingress
      params:
        namespace: ${{ data.app_namespace }}
        replicaCount: 3
        serviceType: LoadBalancer

    # --- Monitoring stack (Helm via Python template) ---
    monitoring:
      template: kubernetes/monitoring.py
      params:
        project: ${{ data.project }}
        environment: ${{ data.environment }}
        chart_path: charts/monitoring-stack
        namespace: monitoring
        retention: 90d
        storage_size: 100Gi
        prometheus_replicas: 2
        grafana_replicas: 2
        alert_channel: "#prod-alerts"
        prometheus_resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
        grafana_resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi

    # --- Sample microservice (K8s manifests) ---
    microservice:
      template: kubernetes/sample_app.py
      params:
        project: ${{ data.project }}
        environment: ${{ data.environment }}
        app_name: ${{ data.app_name }}
        app_namespace: ${{ data.app_namespace }}
        app_image: ${{ data.app_image }}
        app_port: ${{ data.app_port }}
        db_name: ${{ data.db_name }}
        db_instance_name: ${{ data.db_instance_name }}
