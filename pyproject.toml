[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geni"
version = "0.1.0"
description = "Python-powered infrastructure-as-code compiler. One YAML per environment, compiled into Terraform, Kubernetes, and Helm artifacts."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Agath Emmanuel"},
]
keywords = ["infrastructure", "terraform", "kubernetes", "helm", "iac", "devops", "gitops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
]

[project.scripts]
geni = "geni.cli:main"

[project.urls]
Homepage = "https://github.com/AgathEmmanuel/geni"
Repository = "https://github.com/AgathEmmanuel/geni"
Issues = "https://github.com/AgathEmmanuel/geni/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring external tools (helm, hcl2json)",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
