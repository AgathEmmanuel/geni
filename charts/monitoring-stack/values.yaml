namespace: monitoring
prometheus:
  image: prom/prometheus:v2.50.0
  replicas: 1
  retention: 15d
  storageSize: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
grafana:
  image: grafana/grafana:10.3.0
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
