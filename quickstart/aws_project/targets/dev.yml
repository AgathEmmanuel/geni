apiVersion: geni.io/v1alpha1
kind: Target
metadata:
  name: dev
  labels:
    environment: dev
    team: platform
spec:
  data:
    project: my-aws-project
    region: us-east-1
    environment: dev
    cluster_name: dev-cluster
    vpc_cidr: "10.0.0.0/16"
    db_instance_class: db.t3.medium
    db_name: appdb
    db_user: appuser
    instance_type: t3.medium
    key_name: dev-keypair
    app_name: sample-app
    app_namespace: sample-app
    app_image: nginx:1.25
    app_port: 80

  output: generated/dev

  resources:
    backend:
      template: terraform/backend.tf
      params:
        bucket: my-aws-project-tfstate
        key: dev/terraform.tfstate
        region: ${{ data.region }}
        dynamodb_table: my-aws-project-tflock

    provider:
      template: terraform/provider.tf
      params:
        region: ${{ data.region }}

    networking:
      template: terraform/networking.py
      params:
        project: ${{ data.project }}
        region: ${{ data.region }}
        environment: ${{ data.environment }}
        vpc_cidr: ${{ data.vpc_cidr }}

    iam:
      template: terraform/iam.py
      params:
        project: ${{ data.project }}
        environment: ${{ data.environment }}
        cluster_name: ${{ data.cluster_name }}
        app_name: ${{ data.app_name }}
        app_namespace: ${{ data.app_namespace }}

    storage:
      template: terraform/storage.py
      params:
        project: ${{ data.project }}
        environment: ${{ data.environment }}
        buckets:
          - name: app-assets
            versioning: true
          - name: app-backups
            versioning: true
          - name: app-uploads
            versioning: false

    compute:
      template: terraform/compute.py
      params:
        project: ${{ data.project }}
        environment: ${{ data.environment }}
        instance_type: ${{ data.instance_type }}
        key_name: ${{ data.key_name }}

    database:
      template: terraform/database.py
      params:
        project: ${{ data.project }}
        environment: ${{ data.environment }}
        db_name: ${{ data.db_name }}
        db_user: ${{ data.db_user }}
        db_instance_class: ${{ data.db_instance_class }}

    kubernetes:
      template: terraform/kubernetes.py
      params:
        project: ${{ data.project }}
        region: ${{ data.region }}
        environment: ${{ data.environment }}
        cluster_name: ${{ data.cluster_name }}
        instance_type: ${{ data.instance_type }}

    outputs:
      template: terraform/outputs.py
      params:
        project: ${{ data.project }}
        environment: ${{ data.environment }}
        cluster_name: ${{ data.cluster_name }}

    sample_app:
      template: kubernetes/sample_app.py
      params:
        app_name: ${{ data.app_name }}
        app_namespace: ${{ data.app_namespace }}
        app_image: ${{ data.app_image }}
        app_port: ${{ data.app_port }}
        environment: ${{ data.environment }}
        project: ${{ data.project }}
        db_name: ${{ data.db_name }}
